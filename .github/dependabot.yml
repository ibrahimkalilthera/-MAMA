version: 2

# Dependabot ouvre des PR automatiques pour les mises à jour de dépendances.
#
# - npm (racine)    : toutes les dépendances du projet — quotidien, la fréquence
#   la plus rapide offerte par Dependabot (le plus proche de « dès qu'elles sortent »).
# - npm (/tools)    : la CLI vercel épinglée pour le déploiement CI. Le package.json
#   racine n'a plus `vercel` (retiré pour éliminer ses pins vulnérables du lock —
#   voir DEVELOPMENT_HISTORY.md) ; /tools est le point de surveillance qui fait
#   évoluer le CLI via des PR revues, chaque PR devenant la version déployée.
# - github-actions  : les actions utilisées par les workflows (.github/workflows).
#
# Note : `xlsx` est un tarball CDN (SheetJS). Dependabot ne peut pas proposer de
# mise à jour pour une dépendance déclarée par URL — à suivre manuellement.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deploy)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
