name: Database backup

# ─────────────────────────────────────────────────────────────────────────────
# « La base est-elle sauvegardée, et la sauvegarde est-elle relisible ? »
#
# Jusqu'au 2026-09-13, ce dépôt n'avait AUCUN moyen de sauvegarder la base : une
# erreur de manipulation était définitive, et la seule copie des données d'école
# vivait dans un projet dont personne ne relisait l'état. Ce workflow ferme ce
# trou, et il le ferme de façon prouvable :
#
#   1. `npm run backup:db -- --encrypt --require-encryption` lit les tables
#      déclarées (scripts/lib/db-tables.mjs), écrit le contenu + son manifeste,
#      et REFUSE d'écrire en clair. C'est non négociable dans un dépôt PUBLIC :
#      un artefact de workflow y est téléchargeable par n'importe qui, donc un
#      dump en clair remonté ici serait exactement la fuite que la veille des
#      secrets existe pour empêcher.
#   2. `npm run backup:verify` RELIT la sauvegarde sans aucune base (déchiffre,
#      vérifie le manifeste, recompte chaque table) : une sauvegarde qu'on n'a
#      jamais rouverte n'est pas une sauvegarde.
#   3. L'artefact chiffré est conservé 30 jours, et le script publie sa mesure
#      (lignes, tables, chiffré) par l'étape de preuve nommée.
#
# Si `BACKUP_PASSPHRASE` n'est pas posé, le job est ROUGE et le dit : une
# sauvegarde quotidienne non configurée doit se voir, pas se deviner le jour où
# l'on en a besoin. Poser le secret (Settings → Secrets and variables → Actions,
# une phrase de 12 caractères minimum) rend le job vert — et le même secret
# déchiffre l'archive (`npm run restore:db -- --from <dossier>`, en local).
#
# ─── CE QUE CE WORKFLOW NE FERME PAS (dit ici, pas ailleurs) ────────────────
#   1. (fermé le 2026-11-08) La copie hors GitHub : elle n'existait pas, et
#      l'artefact — supprimé 30 jours après — en tenait lieu. L'étape « Déposer
#      la copie HORS GitHub » dépose désormais l'archive CHIFFRÉE dans le seau
#      `db-backups` et la RELIT ; `backup-age-watch.yml` refuse une copie de plus
#      de 48 h. L'artefact reste en plus (rapatriement commode), il n'est plus
#      la seule copie.
#   2. L'escrow de la phrase : `BACKUP_PASSPHRASE` ne vit que dans les secrets de
#      ce dépôt. Si elle est perdue, chaque archive est illisible — même
#      téléchargée, même sur un autre support. La procédure (deux copies, deux
#      lieux, un détenteur nommé, une vérification qui ne l'expose pas) est dans
#      docs/BACKUP.md, section « l'escrow de la phrase ».
#   3. La restauration dans un projet HÉBERGÉ : elle n'a jamais été exercée (la
#      seule base joignable est la production). La procédure pas à pas est dans
#      docs/BACKUP.md, et l'aller-retour local, lui, tourne en CI
#      (backup-roundtrip.yml).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 02:20 UTC — la nuit, quand personne n'écrit.
    - cron: '20 2 * * *'

  workflow_dispatch:

concurrency:
  group: backup-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Sauvegarder la base (chiffré) et relire la sauvegarde
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Comme les autres jobs : installer Node ne prouve pas le majeur exécuté.
      - name: Node version parity (.nvmrc ↔ engines ↔ runtime)
        run: node scripts/check-node-version.mjs

      - name: Refuser de tourner sans phrase de chiffrement
        # Nommé ici, une fois : sans elle, `--require-encryption` ferait échouer
        # l'étape suivante pour une raison moins lisible.
        run: |
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error title=Sauvegarde non configurée::BACKUP_PASSPHRASE est absent — aucune sauvegarde ne peut être écrite en clair dans un dépôt public. Posez le secret (Settings → Secrets and variables → Actions), 12 caractères minimum."
            exit 1
          fi
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: Sauvegarder la base (chiffré, manifeste vérifiable)
        # Mandat de preuve : le script publie lui-même ce qu'il a mesuré (lignes,
        # tables, chiffrement) — et il nomme les tables métier vides.
        env:
          AUTOMATION_EVIDENCE: '1'
          SUPABASE_URL: https://rpcjdohfxwukbqngbprw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: npm run backup:db -- --out .backup/current --encrypt --require-encryption

      - name: Relire la sauvegarde SANS base de données
        # Le contrôle qui compte : ni credentials, ni réseau. Il déchiffre,
        # vérifie le manifeste et recompte chaque table.
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: npm run backup:verify -- --from .backup/current

      - name: Conserver l’archive chiffrée (30 jours)
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-encrypted
          path: .backup/current/
          retention-days: 30
          if-no-files-found: error

      # La copie DURABLE. Le même contenu chiffré part dans le seau du projet
      # Supabase, qui ne meurt pas au bout de 30 jours ; le script relit l'objet
      # déposé et échoue s'il n'y est pas. Sans les secrets, l'étape est rouge :
      # une durabilité qu'on croit acquise est pire que pas de durabilité.
      - name: Déposer la copie HORS GitHub (seau chiffré, relue)
        env:
          SUPABASE_URL: https://rpcjdohfxwukbqngbprw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run backup:offsite -- --from .backup/current

      # L'artefact GitHub PÉRIME (30 jours) : il reste le téléchargement
      # commode, pas la copie durable — celle-ci est l'objet du seau, déposé et
      # relu à l'étape précédente. L'échéance est quand même DATÉE dans le résumé,
      # parce qu'un téléchargement commode qu'on croit durable est le piège qui a
      # rendu la copie périssable. Et l'âge de la copie DURABLE n'est pas supposé :
      # `.github/workflows/backup-age-watch.yml` devient rouge si le dernier objet
      # vérifié du seau a plus de 48 h — un fichier de sauvegarde qu'on ne date
      # jamais finit par être une intention.
      # Un fait que la phrase de chiffrement rend vital : sans elle, l'archive est
      # illisible MÊME téléchargée — l'escrow est décrit dans docs/BACKUP.md.
      - name: Dire la date limite de la SEULE copie
        run: |
          limite=$(date -u -d '+30 days' +%F 2>/dev/null || date -u -v+30d +%F)
          {
            echo "## L’artefact GitHub périmpte le $limite — la copie durable, non"
            echo
            echo "L’artefact chiffré \`db-backup-encrypted\` de ce run est supprimé par GitHub 30 jours"
            echo "après son dépôt. Ce n’est plus la seule copie : la même archive chiffrée a été déposée"
            echo "dans le seau \`db-backups\` et relue. Télécharger l’artefact reste commode, mais n’est"
            echo "plus une course contre la date. Tout reste illisible sans `BACKUP_PASSPHRASE`, qui doit"
            echo "donc être disponible hors de ce dépôt et connue de plus d’une personne (escrow :"
            echo "docs/BACKUP.md, section « l’escrow de la phrase »)."
            echo
            echo "Téléchargement : ${{ steps.archive.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Preuve publiée par l'étape NOMMÉE : c'est ce nom que l'audit lit dans les
      # étapes du run pour savoir si une preuve était attendue (voir
      # scripts/lib/automation-evidence.mjs, EVIDENCE_STEP_NAME).
      - name: Publier la preuve d’action — sauvegarde de la base
        run: >-
          node scripts/publish-automation-evidence.mjs --acted
          --reason "sauvegarde chiffrée écrite puis relue sans base (manifeste vérifié, tables recomptées) ; les chiffres sont publiés par scripts/backup-db.mjs"
