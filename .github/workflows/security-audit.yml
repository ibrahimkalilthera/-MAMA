name: Security audit

# Empêche la réintroduction de vulnérabilités à chaque push sur main.
# Porte en deux volets (scripts/check-audit.mjs) :
#   1. Aucune vulnérabilité de PRODUCTION (les dépendances runtime doivent
#      être propres — tout ce qui est vulnérable est bloqué).
#   2. Le nombre TOTAL de vulnérabilités reste à 0 (baseline documentée,
#      voir DEVELOPMENT_HISTORY.md). Le CLI vercel a été retiré du projet
#      (déploiement isolé en CI), ses pins dev-only ont donc disparu du lock.
# Une nouvelle vulnérabilité (runtime ou dev) échoue donc ce gate.

on:
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit gate (production clean + total within baseline)
        run: node scripts/check-audit.mjs