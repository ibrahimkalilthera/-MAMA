name: Supabase migrations & RLS anon

# Garde-fou des migrations : démarre une instance Supabase locale (Docker),
# applique les 18 migrations ordonnées depuis un schéma vierge et vérifie par
# l'API REST — le même canal que l'app en production — que le rôle anon ne
# LIT aucune ligne métier (RLS active, zéro policy anon après la migration
# 20260809000000). Une migration qui ne s'applique pas proprement, ou qui
# laisserait une lecture anon remonter des données, rend le job rouge.
#
# Le script scripts/verify-anon-rls.mjs seede d'abord une ligne via
# service_role puis exige que le rôle anon ne la voie pas — le seul moyen de
# distinguer « RLS qui refuse » de « tables vides ». Il couvre aussi la
# surface auth : user_profiles (création d'un vrai utilisateur GoTrue via
# service_role, puis lecture/UPDATE/DELETE anon refusés) et la RPC de mot de
# passe admin_set_user_password (refusée pour anon, tandis que le reset par
# email recover reste joignable).
#
# Se déclenche quand supabase/ change (migrations, config) OU quand le
# garde-fou lui-même change (script + tests) : une évolution du garde-fou
# doit être prouvée par un vrai run, pas seulement par les tests stub.
#
# PORTE VERS LA PRODUCTION (gate n°2) : deploy.yml interroge le verdict de ce
# workflow avant tout déploiement Vercel — un run rouge sur main bloque le
# déploiement, y compris pour un push ultérieur qui ne toucherait pas supabase/
# (le verdict du dernier run terminé s'applique jusqu'à correction).

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/verify-anon-rls.mjs'
      - 'tests/anon-rls.test.ts'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/verify-anon-rls.mjs'
      - 'tests/anon-rls.test.ts'

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations + RLS anon refusé (métier + auth)
    runs-on: ubuntu-latest
    # supabase start tire ~15 conteneurs ; 20 min laissent l'init Docker +
    # l'application des migrations se terminer même sur un runner partagé lent.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Pinné sur la version éprouvée localement (mêmes migrations en local
      # et en CI) ; version bump volontaire et explicite.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase (applies the 18 ordered migrations)
        run: supabase start

      - name: Verify anon reads/writes refused — business tables + auth (user_profiles, RPC password)
        run: |
          # La CLI 2.116.0 exporte ANON_KEY / SERVICE_ROLE_KEY (pas les noms
          # SUPABASE_*) — le script accepte les deux conventions.
          supabase status -o env | tee /tmp/supabase.env
          set -a
          . /tmp/supabase.env
          set +a
          node scripts/verify-anon-rls.mjs