name: Deploy (Vercel)

# Deploys to Vercel production — but ONLY after the quality gate has passed.
#
# Trigger: the "Quality & performance guard" workflow (perf-guard.yml) COMPLETING
# on main. Its `quality` job (lint + tsc strict + tests + npm-audit gate) is the
# single door to production: a push whose quality job fails never reaches this
# workflow, so a broken push can never deploy. This deploy checks out the exact
# commit that quality run validated (`head_sha`) — not a newer one that could
# have landed in between.
#
# Manual deploys stay possible via workflow_dispatch (deploys the current head
# of main — an explicit human action, re-validated locally by the author).
#
# The quality job already runs lint/tests/audit, so this workflow does not
# repeat them; it only needs the project dependencies for `vercel build`
# (`vercel.json` → buildCommand: npm run build).
#
# Second gate — the migrations workflow (supabase-migrations.yml, paths-filtered
# to supabase/**): this workflow cannot be added to the workflow_run trigger
# above (a skipped/failed run would stall or double-fire the deploy), so the
# deploy job polls its run for the exact commit being deployed, then falls back
# to the latest completed run on main. Consequences, all by design:
#   • a commit whose migrations run is red never deploys;
#   • a later push that does NOT touch supabase/** (no new run) inherits the
#     previous run's verdict — a broken migration stays blocking until fixed;
#   • manual workflow_dispatch skips this gate (human override), exactly like
#     the quality gate.
#
# Known trade-off: if the quality workflow itself cannot run (Actions outage,
# disabled workflow), deploys stop too — by design: no green gate, no deploy.
#
# The Vercel CLI is intentionally NOT a root dependency: it is pinned in
# `tools/package.json` (its own lockfile) so its `@vercel/*` transitive pins
# never enter the root package.json / lockfile. Dependabot watches `/tools`
# and opens a reviewed PR whenever a new CLI ships — CI deploys with that
# reviewed pin, so a broken CLI release only reaches production after its PR
# merges. The old local `npm run deploy:prod` was retired in favour of this
# workflow (see scripts/deploy-notice.mjs).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN      — a Vercel access token (https://vercel.com/account/tokens)
#   VERCEL_ORG_ID     — team id, e.g. team_… (see DEVELOPMENT_HISTORY.md)
#   VERCEL_PROJECT_ID — project id, e.g. prj_…
# Production environment variables (VITE_SUPABASE_URL etc.) are pulled from
# Vercel by `vercel pull` so the build sees them — keep them in the Vercel
# dashboard, not in this repo.

on:
  workflow_run:
    workflows: ["Quality & performance guard"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # interroger les runs du workflow migrations (gate n°2)

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 30 min : le gate migrations peut devoir attendre la fin d'un run
    # (~5-10 min de Docker) + build Vercel en aval.
    timeout-minutes: 30
    steps:
      # First step, before even cloning: without a green quality run there is
      # nothing to deploy. Exit 78 marks the job neutral (skipped, not failed).
      - name: Gate — deploy only what quality validated
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Quality workflow concluded '${{ github.event.workflow_run.conclusion }}' on ${{ github.event.workflow_run.head_sha }} — not deploying."
              exit 78
            fi
            echo "Quality passed on ${{ github.event.workflow_run.head_sha }} — deploying exactly that commit."
          else
            echo "Manual dispatch — deploying the current head of main."
          fi

      # Gate n°2 — migrations RLS vertes avant de déployer (parallèle à la
      # porte qualité, même sémantique : exit 78 = neutre, pas rouge).
      - name: Gate — migrations workflow green for this commit
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // Le run peut encore tourner (le gate qualité termine parfois
            // avant le job Docker) : l'attendre jusqu'à la fenêtre de polling.
            const findRun = async (headSha, status) => {
              const params = {
                ...repo,
                workflow_id: 'supabase-migrations.yml',
                branch: 'main',
                per_page: 1,
              };
              if (headSha) params.head_sha = headSha;
              if (status) params.status = status;
              const { data } = await github.rest.actions.listWorkflowRuns(params);
              return data.workflow_runs[0] ?? null;
            };

            const deadline = Date.now() + 15 * 60 * 1000;
            let run = await findRun(sha);
            while (run && ['in_progress', 'queued', 'pending'].includes(run.status) && Date.now() < deadline) {
              console.log(`Migrations run #${run.id} still ${run.status} — waiting 15s…`);
              await sleep(15000);
              run = await findRun(sha);
            }

            if (!run) {
              // Aucun run pour ce commit (supabase/** inchangé) : hériter du
              // verdict du dernier run terminé sur main — une migration cassée
              // reste bloquante jusqu'à correction.
              run = await findRun(null, 'completed');
            }

            if (!run || (['in_progress', 'queued', 'pending'].includes(run.status))) {
              console.log(`No migrations verdict for ${sha} within the polling window — refusing to deploy without a green proof.`);
              process.exit(78);
            }
            if (run.conclusion !== 'success') {
              console.log(`Migrations workflow concluded '${run.conclusion}' (run #${run.id} on ${run.head_sha}) — not deploying.`);
              process.exit(78);
            }
            console.log(`Migrations workflow green (run #${run.id} on ${run.head_sha}) — deploying.`);

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies (needed by vercel build → npm run build)
        run: npm ci

      - name: Install deploy tooling (pinned Vercel CLI, watched by Dependabot)
        run: npm ci --prefix tools

      - name: Pull Vercel production settings and environment
        run: tools/node_modules/.bin/vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build app (Vite) and stage for Vercel
        run: tools/node_modules/.bin/vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production (prebuilt)
        run: tools/node_modules/.bin/vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
