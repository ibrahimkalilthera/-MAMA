name: Deploy (Vercel)

# Deploys to Vercel production on every push to `main`.
#
# The Vercel CLI is intentionally NOT a root dependency: it is pinned in
# `tools/package.json` (its own lockfile) so its `@vercel/*` transitive pins
# never enter the root package.json / lockfile. Dependabot watches `/tools`
# and opens a reviewed PR whenever a new CLI ships — CI deploys with that
# reviewed pin, so a broken CLI release only reaches production after its PR
# merges. The old local `npm run deploy:prod` was retired in favour of this
# workflow (see scripts/deploy-notice.mjs).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN      — a Vercel access token (https://vercel.com/account/tokens)
#   VERCEL_ORG_ID     — team id, e.g. team_… (see DEVELOPMENT_HISTORY.md)
#   VERCEL_PROJECT_ID — project id, e.g. prj_…
# Production environment variables (VITE_SUPABASE_URL etc.) are pulled from
# Vercel by `vercel pull` so the build sees them — keep them in the Vercel
# dashboard, not in this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Lint + type-check + props wiring
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Install deploy tooling (pinned Vercel CLI, watched by Dependabot)
        run: npm ci --prefix tools

      - name: Pull Vercel production settings and environment
        run: tools/node_modules/.bin/vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build app (Vite) and stage for Vercel
        run: tools/node_modules/.bin/vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production (prebuilt)
        run: tools/node_modules/.bin/vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}