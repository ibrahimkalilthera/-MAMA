name: Main push provenance

# ─────────────────────────────────────────────────────────────────────────────
# « Ce commit est-il arrivé sur main par une PR ? »
#
# La protection de branche est active depuis le 2026-11-08 (PR obligatoire, un
# check requis, force-push et suppression refusés) et elle vaut désormais AUSSI
# pour l'administrateur (`enforce_admins: true`) : plus personne ne peut pousser
# directement sur `main`. Les releases — dernier chemin de contournement — ont
# leur propre PR (`npm run release:pr`).
#
# Ce workflow ne bloque pas le push (seul GitHub pourrait) : il rend le
# contournement VISIBLE. Un commit sans PR associée rend le run rouge avec son
# SHA — et il n'exempte plus rien, pas même `chore(release):`.
#
# La barrière en amont, celle qui refuse avant le départ, est `pre-push`
# (scripts/check-push-target.mjs). L'état mesuré est décrit dans
# docs/PROTECTION_MAIN.md.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    name: Le commit vient-il d’une PR ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Vérifier la provenance du commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:direct-push

      # Preuve publiée par l'étape NOMMÉE : c'est ce nom que l'audit lit dans les
      # étapes du run pour savoir si une preuve était attendue (voir
      # scripts/lib/automation-evidence.mjs, EVIDENCE_STEP_NAME). Un garde qui
      # n'agit sur rien (pas de PR trouvée, par exemple) publie son INACTION.
      - name: Publier la preuve d’action — provenance des commits
        run: >-
          node scripts/publish-automation-evidence.mjs --acted
          --reason "provenance du commit confrontée aux PR fusionnées ; le nombre de commits examinés et les SHA sans PR sont publiés par scripts/check-direct-push.mjs"
