name: Dépenses fournisseurs — règle statut/montant payé (quotidienne)

# ─────────────────────────────────────────────────────────────────────────────
# « Le montant payé tient-il la promesse du statut ? »
#
# `vendor_expenses` porte DEUX copies du même fait : `payment_status` (« payé »,
# « partiel », « impayé ») et `amount_paid`. Quatre calculs d'argent les lisent
# ensemble (`useDashboard`, `ExpensesView`, `useYearOps`, `pdfExpensesReport`) :
#
#     status === 'paid'    ? amount
#     status === 'partial' ? amount_paid
#                         : 0
#
# Jusqu'au 2026-11-08, rien en base ne les empêchait de se contredire : un `paid`
# à 0 FCFA, un `unpaid` qui porte un montant, un `partial` à 150 % du dû. Le
# total des dépenses annoncé à l'école est alors faux, et rien ne le voyait — le
# registre des reçus avait sa veille (`payment-ledger-watch`), pas les dépenses.
#
# Les deux déclencheurs (`vendor_expense_paid_consistency` en BEFORE, qui RANGE,
# et `vendor_expense_paid_validation` en AFTER, qui REFUSE — migrations
# 20261108000000_… et 20261108000002_…, ce dernier pour que le refus d'une
# politique RLS reste un 401 et ne devienne pas un 400 du déclencheur) ferment
# les écritures FUTURES et ont rattrapé l'histoire. Ils ne garantissent rien de
# ce qui viendrait APRÈS eux : un
# `DISABLE TRIGGER` (restauration de sauvegarde, intervention en base), une
# migration qui le remplace, un `COPY` fait sans lui. C'est cette faille-là que
# le cron mesure : la règle sur les lignes réelles, chaque jour.
#
# FAIL-ON-DRIFT : une seule dépense dont le montant payé contredit son statut rend
# le job ROUGE (`npm run check:vendor-expenses` sort en 1). Les notifications
# d'échec d'Actions alertent alors — mieux qu'une dépense fausse découverte en fin
# d'année.
#
# Lecture seule : ce job ne corrige RIEN. Le déclencheur normalise les écritures ;
# une ligne divergente signale donc un contournement, et la « corriger » sans
# regarder effacerait sa trace. Un `partial` hors bornes demande un arbitrage.
#
# Deux déclencheurs, comme les autres veilles : le push (le moment où la règle ou
# le contrôle changent — sans quoi le cron neuf resterait sans run et l'audit des
# automatisations le dirait « dormant ») et un cron quotidien, parce qu'une
# divergence naît d'une écriture en base, jamais d'un commit.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-vendor-expenses.mjs'
      - 'scripts/lib/vendor-expense-ledger.mjs'
      - 'supabase/migrations/20261108000000_vendor_expense_paid_consistency.sql'
      - 'supabase/migrations/20261108000002_vendor_expense_paid_validation_after_rls.sql'
      - '.github/workflows/vendor-expense-watch.yml'

  schedule:
    # 06:35 UTC — avant l'audit des automatisations (06:41), qui juge la preuve
    # publiée par ce run.
    - cron: '35 6 * * *'

  workflow_dispatch:

concurrency:
  group: vendor-expense-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  expenses:
    name: Mesurer payment_status et amount_paid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Comme les autres jobs : installer Node ne prouve pas le majeur exécuté.
      - name: Node version parity (.nvmrc ↔ engines ↔ runtime)
        run: node scripts/check-node-version.mjs

      # `pg` n'est pas une dépendance déclarée du dépôt (outillage ponctuel, comme
      # les scripts qui lisent la base) : on l'installe sans toucher package.json.
      # Le script, lui, échoue proprement si le module manque.
      - name: Installer l'outillage Postgres (pg, non déclaré)
        run: npm i --no-save pg

      # Le script publie lui-même ce qu'il a LU (dépenses) et ce qu'il a TROUVÉ
      # (dépenses dont le montant ne tient pas le statut), sous le mandat de cette
      # étape. Sans mot de passe, il déclare son inaction puis sort en 2 — l'étape
      # rougit, rien n'est maquillé en vert.
      - name: Mesurer la règle statut/montant des dépenses fournisseurs
        env:
          AUTOMATION_EVIDENCE: '1'
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run check:vendor-expenses

      # Preuve publiée par l'étape NOMMÉE : c'est ce nom que l'audit lit dans les
      # étapes du run pour savoir si une preuve était attendue (voir
      # scripts/lib/automation-evidence.mjs, EVIDENCE_STEP_NAME).
      - name: Publier la preuve d’action — dépenses fournisseurs
        run: >-
          node scripts/publish-automation-evidence.mjs --acted
          --reason "règle statut/montant des dépenses fournisseurs mesurée jusqu'au bout ; le nombre de dépenses lues et les dépenses dont le montant payé ne tient pas le statut sont publiés par scripts/check-vendor-expenses.mjs"
