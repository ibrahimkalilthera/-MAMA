# ─────────────────────────────────────────────────────────────────────────────
# Desktop release (Windows) — build + signature + publication AUTOMATIQUE.
#
# Déclenché par la CHAÎNE QUALITÉ, pas par un humain : quand le run qualité de
# `main` finit vert, ce workflow demande à `npm run check:release:needed` s'il y a
# un release à faire (la version du paquet est-elle encore inédite ? un brouillon
# est-il à reprendre ?) et, si oui, enchaîne build → signature → téléversement en
# brouillon → CONSOLIDATION des brouillons en double → PROMOTION → relecture du
# canal. Aucune de ces étapes n'est un clic ni un appel d'API manuel ; la seule
# décision humaine qui reste est de MONTER LA VERSION, c'est-à-dire un commit.
#
# Il construit l'app de bureau Windows, la SIGNE avec un certificat de confiance
# quand il en existe un, et publie un GitHub Release — le canal electron-updater
# (setup.exe + portable + latest.yml dans le même release).
#
# Sans certificat, le build est NON SIGNÉ et **publie quand même** — décision du
# 2026-09-13, prise en connaissance de cause et écrite ici pour qu'elle ne se
# perde pas. Ce qu'elle règle : un build sans `publisherName` embarqué laisse le
# poste se mettre à jour (`electron-updater` ne vérifie une signature que si un
# signataire est PROMIS). Ce qu'elle ne règle PAS : Windows affiche toujours
# « éditeur inconnu » — seul un certificat approuvé lève cet avertissement, et le
# publieur le dit lui-même.
#
# Ce qui reste INTERDIT, et le publieur s'en porte garant : signer avec un
# certificat NON approuvé (auto-signé, de test). C'est ce qui a été fait pour la
# 1.0.8 — `publisherName: [ "Mama Thera Finance (test)" ]` et une racine non
# approuvée — et chaque poste équipé refusait À JAMAIS toutes les mises à jour
# (ERR_UPDATER_INVALID_SIGNATURE) : un parc figé, sous un workflow vert.
# `npm run check:updater-trust`, appelé par `release:publish` AVANT la première
# requête, refuse ce contrat quel que soit l'endroit d'où l'on publie. Un
# certificat de test « pour que ça passe » ne passe donc pas — et c'est voulu.
#
# `workflow_dispatch` reste, pour une reprise explicite (le certificat vient
# d'être posé, un build a été corrigé) : la voie normale n'en a plus besoin.
#
# Le téléversement ne passe PLUS par `electron-builder --publish always` : ce
# chemin a payé deux fois le même défaut ici (electron-builder ouvre un release
# par cible — un brouillon pour le NSIS, un pour le portable — donc des artefacts
# répartis entre deux releases, et promouvoir le mauvais publiait un release SANS
# latest.yml, une mise à jour que personne ne voit). C'est désormais
# `scripts/publish-release.mjs` qui téléverse les octets vérifiés, un fichier à la
# fois, dans UN SEUL release : la forme du release ne dépend plus d'un outil tiers.
#
# Trois contrôles de cohérence encadrent la publication, et chacun attrape une
# incohérence DÉJÀ payée ici : le tag ne doit pas exister (1.0.1 republiée
# n'aurait atteint personne), le dossier local doit dire la même chose que le
# paquet et ses octets, et les octets TÉLÉVERSÉS (brouillon) doivent répondre à
# latest.yml avant que la promotion ne les rende visibles.
#
# Secrets à configurer (Settings → Secrets and variables → Actions) :
#   CSC_PFX_B64       certificat .pfx encodé en base64
#   CSC_KEY_PASSWORD  mot de passe du certificat
#   SIGNING_ENABLED   variable de dépôt (Settings → Variables) : `true` rend la
#                     signature UTILISABLE. Sans elle, les secrets sont restaurés
#                     et JAMAIS employés — parce qu'un secret présent ne dit pas
#                     qu'il est utilisable, et que le prendre sans le dire est
#                     exactement ce qui a gravé le certificat de test dans la 1.0.8.
#
# Ces secrets restent la voie pour FAIRE DISPARAÎTRE l'avertissement de Windows :
# seul un certificat approuvé le lève. Mais leur absence n'empêche plus de
# publier — elle empêche seulement d'avoir un éditeur nommé, et la preuve d'action
# du job le dit désormais en toutes lettres (« installeur NON signé ») pour qu'un
# parc qui se met à jour ne se lise pas comme un parc sans avertissement.
# ─────────────────────────────────────────────────────────────────────────────
name: Desktop release (Windows)

on:
  workflow_run:
    workflows: ["Quality & performance guard"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Une seule publication à la fois : le publieur LIT l'état du tag (quel
  # brouillon existe, quel brouillon est le plus complet) puis AGIT dessus — deux
  # exécutions en parallèle pourraient supprimer le brouillon que l'autre est en
  # train de compléter. Jamais d'annulation en cours de route : un téléversement
  # interrompu laisse un brouillon, et c'est exactement ce que le plan sait
  # reprendre au run suivant.
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Le gate qui a remplacé le geste humain. Deux questions, et deux seulement :
  # la chaîne qualité est-elle verte, et y a-t-il quelque chose à publier ?
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lire la conclusion du run qualité
    outputs:
      proceed: ${{ steps.release-gate.outputs.needed == 'true' && steps.quality-gate.outputs.proceed == 'true' }}
    steps:
      - name: Gate — publier seulement après une chaîne qualité verte
        id: quality-gate
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('proceed', 'false');
            if (context.eventName !== 'workflow_run') {
              console.log('Lancement manuel — publication demandée explicitement.');
              core.setOutput('proceed', 'true');
              return;
            }
            const run = context.payload.workflow_run;
            console.log(`Quality workflow concluded '${run.conclusion}' on ${run.head_sha}.`);
            if (run.conclusion !== 'success') {
              console.log(`Qualité non verte (${run.conclusion}) — rien ne part sur le canal de mise à jour.`);
              return;
            }
            core.setOutput('proceed', 'true');

      - uses: actions/checkout@v7
        if: steps.quality-gate.outputs.proceed == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v7
        if: steps.quality-gate.outputs.proceed == 'true'
        with:
          node-version-file: .nvmrc

      # La décision vit dans un script testé, pas dans ce YAML : le mode
      # `needed` réutilise la même `publishDecision` que le gate d'avant-
      # publication, donc « déjà publié » veut dire « rien à faire » des deux
      # côtés. Il publie un ÉTAT (`needed=true|false`), pas un échec : un numéro
      # déjà publié est le cas NORMAL d'un push qui ne monte pas la version.
      - name: Gate — y a-t-il quelque chose à publier ?
        id: release-gate
        if: steps.quality-gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:release:needed

  build-sign-publish:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # La MÊME configuration que celle que les postes recevront : `electron:ui`
      # compile l'app avec ces valeurs, donc `VITE_SUPABASE_ANON_KEY` manquante ne
      # donne pas une app dégradée mais une app qui REFUSE de démarrer (« Configuration
      # Supabase manquante », mesuré sur le runner). Et un installeur publié qui ne
      # démarre pas atteindrait TOUT le parc, pas un job — c'est la seule
      # publication de tout le dépôt dans ce cas. L'URL et la clé anon sont
      # PUBLIQUES (embarquées dans le bundle servi à chaque navigateur, protégées
      # par RLS) et figurent déjà dans les autres workflows ; seule la clé service
      # est un secret, et ce job n'en a pas besoin. Le fichier est généré ici et
      # jamais commité.
      - name: Générer .env — la configuration que le poste embarquera
        shell: bash
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=https://rpcjdohfxwukbqngbprw.supabase.co
          VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwY2pkb2hmeHd1a2JxbmdicHJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MjQxNTEsImV4cCI6MjEwMTIwMDE1MX0.kbRyapKoWueAOneDlTF73fxv88RloJNsygT8acIkycQ
          EOF
          grep -c . .env

      # ── LE point de signature, et le seul ─────────────────────────────────
      # Aujourd'hui : un certificat `.pfx` restauré depuis les secrets. Deux
      # voies existent, et elles se remplacent ici, pas ailleurs :
      #   • certificat OV/EV acheté → `CSC_PFX_B64` + `CSC_KEY_PASSWORD` ;
      #   • signature OSS gratuite (SignPath Foundation, certificats EV) → le
      #     connecteur GitHub de SignPath, qui remplace cette étape et rend les
      #     octets SIGNÉS avant `npm run release:publish`.
      # Marche à suivre et prérequis mesurés : docs/CODE_SIGNING.md §1 bis.
      # Dans les deux cas, `npm run check:updater-trust` juge ensuite le contrat
      # embarqué AVANT la première requête et refuse un signataire que Windows
      # ne peut pas approuver — c'est ce refus qui rend cette étape sûre.
      # Restaurer n'est pas décider : ce qui se trouve dans le secret est POSÉ,
      # pas utilisé. L'usage dépend de `SIGNING_ENABLED` (variable du dépôt, pas
      # un secret) — parce qu'un secret présent ne dit pas qu'il est utilisable.
      # C'est la leçon de la 1.0.8 : le certificat de TEST était dans ces secrets,
      # le runner l'a pris, l'a gravé dans le contrat du binaire, et chaque poste
      # équipé a refusé à jamais ses mises à jour. Sans le choix explicite, il
      # n'existe plus de chemin par lequel un secret oublié signe ce qu'on livre.
      - name: Restore code-signing certificate
        shell: bash
        env:
          CSC_PFX_B64: ${{ secrets.CSC_PFX_B64 }}
        run: |
          if [ -n "$CSC_PFX_B64" ]; then
            echo "$CSC_PFX_B64" | base64 -d > "$RUNNER_TEMP/code-sign.pfx"
            echo "certificat restauré ($(wc -c < "$RUNNER_TEMP/code-sign.pfx") octets) — utilisé seulement si SIGNING_ENABLED=true"
          else
            # L'absence de certificat n'est pas une anomalie : c'est l'état de
            # RÉFÉRENCE du parc — celui de la 1.0.9 publiée (aucun
            # `publisherName` promis, octets NotSigned). Un `::warning::` ici
            # clignoterait à chaque publication légitime, c'est-à-dire
            # apprendrait à ignorer le seul signal qui compte.
            echo "→ aucun certificat dans les secrets"
          fi

      - name: Build, sign and publish (electron-updater channel)
        id: build
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
        run: |
          if [ "$SIGNING_ENABLED" = "true" ] && [ -f "$RUNNER_TEMP/code-sign.pfx" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            export CSC_LINK="$(cygpath -w "$RUNNER_TEMP/code-sign.pfx")"
            echo "→ build signé avec CSC_LINK=$CSC_LINK"
            # 1. Le numéro est-il INÉDIT ? (un même numéro ne peut pas changer de
            #    contenu : republier n'atteint aucun poste). Le refus tombe ici,
            #    avant que quoi que ce soit n'ait été téléversé.
            npm run check:release:tag
            # 2. Build + gate local + téléversement en BROUILLON + gate du
            #    brouillon : les octets téléversés sont rehachés depuis le dépôt
            #    et comparés à ce que latest.yml promet. Un gate rouge fait
            #    échouer le job ICI, donc la promotion ci-dessous n'a pas lieu.
            npm run electron:release
            # 3. La promotion est le geste qui REND VISIBLE : un brouillon n'est
            #    lu par aucun poste, donc l'étape 2 seule ne livre rien. Elle ne
            #    s'exécute que si le gate du brouillon est vert — c'est le
            #    contrôle qui sert de passeport, pas de conseil. C'est le même
            #    programme qui promeut et qui prouve (étapes 4 et 5), pour qu'il
            #    ne puisse pas y avoir de promotion sans relecture du canal.
            npm run release:promote
            # 4. `--promote` relit ENFIN ce que les postes lisent — le flux
            #    publié, rehaché depuis le dépôt public, SANS jeton — puis le
            #    canal vivant et le frein d'urgence. Comme il le fait dans le même
            #    processus, un flux illisible fait rougir le job au lieu d'être
            #    seulement signalé.
          else
            # NON signé, et publié QUAND MÊME (décision du 2026-09-13, cf.
            # l'en-tête). Refuser de publier cet état avait renvoyé la publication
            # vers une machine locale — où un certificat de test a signé la 1.0.8
            # et gelé le parc.
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ -f "$RUNNER_TEMP/code-sign.pfx" ]; then
              # Le cas qui a produit l'incident, nommé au lieu d'être tu : un
              # certificat EXISTE dans les secrets et n'est pas utilisé. Le taire
              # ferait lire un canal signé là où il n'y en a pas.
              echo "→ certificat présent dans les secrets, signature ÉTEINTE (variable de dépôt SIGNING_ENABLED absente ou ≠ true) : build NON signé, publication autorisée"
            else
              echo "→ aucun certificat : build NON signé (aucun publisherName embarqué) — état de référence (1.0.9), publication autorisée"
            fi
            npm run check:release:tag
            npm run electron:release
            npm run release:promote
          fi

      # LE SEUL runner où `release/` existe. C'est ce qui décide de la place de ce
      # contrôle : sur un runner ordinaire le dossier n'est pas là, et l'atelier
      # répond honnêtement « non applicable — rien à juger » (vert qui s'explique,
      # donc cron inutile : il serait vert sans rien regarder). Ici, le build vient
      # d'écrire dedans, et c'est le moment où le piège se referme : un installeur
      # d'une version DÉJÀ publiée qui traîne dans le dossier est exactement le
      # fichier qu'un humain reprendra à la main, et le canal en sert déjà les
      # octets — la preuve existe, donc le contrôle peut la dire.
      #
      # Strict, sans dérogation : un job de publication ne peut pas déclarer
      # l'atelier propre s'il n'a pas pu lire le canal. Les artefacts de la version
      # en cours sont CONSERVÉS (c'est la sortie du build, les contrôles locaux la
      # lisent) — ce sont les restes des autres numéros que ce pas repère.
      - name: L’atelier de sortie ne garde rien que le canal sert déjà
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:release:workshop

      # Preuve publiée par l'étape NOMMÉE (lue dans les étapes du run par
      # `npm run check:automations`). Le compte n'est pas une hypothèse : il est lu
      # sur le DISQUE — l'installeur n'est pas un effet de bord, c'est ce que ce job
      # existe pour produire, et un build qui n'a rien sorti doit le dire (preuve
      # d'inaction + run rouge) plutôt que publier un « 2 » écrit d'avance.
      #
      # Et « j'ai agi » exige que quelque chose soit réellement PUBLIÉ : sous le
      # déclencheur automatique, ce job ne démarre que s'il y avait un release à
      # faire, et il refuse de conclure si rien n'est sorti sur le disque. Depuis
      # la décision du 2026-09-13, un build NON signé EST publié — donc `--acted`
      # est le verdict, à condition de dire QUELLE signature le parc reçoit.
      - name: Publier la preuve d’action — installeur Windows
        if: success()
        shell: bash
        run: |
          COUNT=$(ls release/*.exe 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 2 ]; then
            node scripts/publish-automation-evidence.mjs --inert \
              --reason "aucun installeur dans release/ ($COUNT fichier .exe) — le build n'a rien produit"
            exit 1
          fi
          # La signature est DITE, jamais supposée : un parc qui se met à jour sous
          # « éditeur inconnu » n'est pas un parc signé, et une preuve qui tairait la
          # différence ferait passer le second pour le premier.
          if [ "${{ steps.build.outputs.signed }}" = "true" ]; then
            SIGN_KIND="installeur SIGNÉ"
          else
            SIGN_KIND="installeur NON signé — aucun signataire promis, dont les postes se mettent à jour ; Windows affichera « éditeur inconnu »"
          fi
          node scripts/publish-automation-evidence.mjs --acted --count "$COUNT" \
            --reason "version publiée sur le canal : $COUNT artefact(s) Windows dans release/ ($SIGN_KIND + portable, blockmaps, latest.yml) — la promotion et la relecture du canal sont faites par le même programme"