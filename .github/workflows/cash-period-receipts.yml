name: Contrôle des doublons (clôture de caisse)

# ─────────────────────────────────────────────────────────────────────────────
# « À chaque clôture de période de caisse, relancer le contrôle des doublons et
#   archiver les CSV datés. »
#
# DEUX FAMILLES, UN SEUL PASSAGE. Le même run contrôle :
#   • les REÇUS de la semaine ISO close (lundi → dimanche, le découpage du
#     journal d'audit de l'app, src/lib/auditWeek.ts) — un paiement saisi deux
#     fois, un numéro de reçu réutilisé ;
#   • le REGISTRE DES ÉLÈVES en ENTIER — une fiche en double (même nom, même
#     classe), avec les colonnes qui permettent de trancher (matricule, parent,
#     téléphone, total dû, dates). Pas de borne de période ici : un doublon
#     d'inscription ne se périme pas avec la semaine, et une liste de choses à
#     trancher qui s'effacerait toute seule serait pire qu'inutile — c'est
#     pourquoi `--closing-week` ne borne QUE les paiements.
#
# La logique des bornes n'est PAS écrite dans ce YAML :
# `npm run report:duplicates --closing-week` la prend dans
# scripts/lib/duplicate-receipts.mjs, où tests/duplicate-receipts.test.ts la
# prouve (y compris les bords d'année), et les critères du registre vivent dans
# scripts/lib/duplicate-students.mjs, prouvés par tests/duplicate-students.test.ts.
# Un calcul de dates recopié ici pourrait diverger en silence ; une seule
# définition, celle du script.
#
# Le rapport est en LECTURE SEULE : il n'écrit rien en base. Les CSV datés
# partent en ARTEFACT du run (rétention), d'où l'école les récupère après chaque
# période. Ils ne se mélangent pas : chaque famille a son propre fichier, avec
# ses propres colonnes — un en-tête unique pour deux formes de lignes finirait
# par mentir sur l'une des deux.
#
# Le script lit la base par une connexion DIRECTE (pg) : il lui faut le secret de
# dépôt SUPABASE_DB_PASSWORD (Settings → Secrets and variables → Actions).
# Sans lui, le contrôle est INDÉCIS (exit 2) et le dit — « je n'ai pas pu
# regarder » n'est jamais un vert, et l'absence se voit dans le run.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Lundi 06:15 UTC — la semaine ISO (lundi→dimanche) vient de se clore, et ce
    # run précède l'audit des automatisations (06:41) qui juge sa preuve.
    - cron: '15 6 * * 1'

  workflow_dispatch:

  # Un push qui touche le contrôle lui-même le rejoue sur le vrai runner — la
  # première fois, le merge qui ajoute ce fichier. Sans ce déclencheur, un cron
  # neuf resterait sans run jusqu'au lundi suivant, et l'audit des automatisations
  # le déclarerait « dormant » (un cron qui ne part pas est en panne).
  push:
    branches: [main]
    paths:
      - 'scripts/report-duplicates.mjs'
      - 'scripts/lib/duplicate-receipts.mjs'
      - 'scripts/lib/duplicate-students.mjs'
      - '.github/workflows/cash-period-receipts.yml'

concurrency:
  group: cash-period-receipts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  duplicates:
    name: Doublons de la période close (reçus + registre)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Comme les autres jobs : installer Node ne prouve pas le majeur exécuté.
      - name: Node version parity (.nvmrc ↔ engines ↔ runtime)
        run: node scripts/check-node-version.mjs

      # `pg` n'est pas une dépendance déclarée du dépôt (outillage ponctuel, comme
      # les autres scripts qui lisent la base) : on l'installe sans toucher
      # package.json. Le script, lui, échoue proprement si le module manque.
      - name: Installer l'outillage Postgres (pg, non déclaré)
        run: npm i --no-save pg

      # Le script publie lui-même ce qu'il a MESURÉ (paiements et fiches
      # analysés, lignes à vérifier, dans les deux familles), sous le mandat de
      # cette étape. Sans mot de passe, il déclare son inaction puis sort en 2 —
      # l'étape rougit, rien n'est maquillé en vert.
      - name: Contrôler les doublons de la période close
        env:
          AUTOMATION_EVIDENCE: '1'
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run report:duplicates -- --closing-week

      # La date de clôture, portée par le nom de l'artefact (les CSV, eux,
      # portent la clé ISO de la semaine dans leur propre nom de fichier).
      - name: Date de la clôture
        id: cloture
        run: echo "jour=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # L'archive : les CSV de la période partent en artefact, retenus assez
      # longtemps pour couvrir un trimestre. Absent = erreur, jamais un succès
      # vide — un run vert dont le contrôle n'a rien produit ne prouve rien.
      - name: Archiver les CSV de la période
        uses: actions/upload-artifact@v7
        with:
          name: doublons-${{ steps.cloture.outputs.jour }}
          path: rapport-*.csv
          if-no-files-found: error
          # 90 : le maximum autorisé par les réglages du dépôt. Au-delà, GitHub
          # ramène la valeur à ce plafond — et le dit dans les annotations.
          retention-days: 90

      # Preuve publiée par l'étape NOMMÉE : c'est ce nom que l'audit lit dans les
      # étapes du run pour savoir si une preuve était attendue (voir
      # scripts/lib/automation-evidence.mjs, EVIDENCE_STEP_NAME).
      - name: Publier la preuve d’action — doublons de la période close
        run: >-
          node scripts/publish-automation-evidence.mjs --acted
          --reason "contrôle des doublons de la période close exécuté ; les chiffres (paiements et fiches analysés, lignes à vérifier) sont publiés par scripts/report-duplicates.mjs"
