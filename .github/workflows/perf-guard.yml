name: Quality & performance guard

# Porte de qualité unique à chaque push sur main — remplace les deux anciens
# workflows security-audit.yml (audit npm) et perf-guard.yml (Lighthouse) :
#
#   Job `quality`   : `npm run lint` — LA chaîne du poste, telle quelle, pas un
#                     sous-ensemble recopié (ESLint 0 warning, tsc strict,
#                     props/casts, gardes du harnais de tests, stylelint, CSS,
#                     emoji, i18n, dates Windows, budget de lignes, snapshot SQL ;
#                     le gate de version Node est le premier maillon), puis
#                     tests (node:test), puis le gate d'audit
#                     (scripts/check-audit.mjs) en deux volets :
#                       1. Aucune vulnérabilité de PRODUCTION (les dépendances
#                          runtime doivent être propres — tout ce qui est
#                          vulnérable est bloqué).
#                       2. Le nombre TOTAL de vulnérabilités reste à 0
#                          (baseline documentée — voir DEVELOPMENT_HISTORY.md ;
#                          le CLI vercel est isolé dans tools/, hors du gate).
#                     Toute nouvelle vulnérabilité (runtime ou dev) échoue.
#   Job `lighthouse`: mesure Lighthouse (mobile, performance) sur un build de
#                     production à chaque push. Échoue — et signale le push en
#                     rouge — si le score passe sous 0.60 en CI — seuil calibré
#                     sur les runners GitHub, plus lents que la machine locale :
#                     un build sain y mesure ~67 contre ~93 en prod réel.
#   Job `tools-audit`: audit NON BLOQUANT (warning-only) de l'arbre de la CLI
#                     vercel isolée (tools/) — ses pins dev-only vulnérables
#                     sont assumés et suivis ; le job ne peut JAMAIS rougir
#                     le workflow (exit 0 + continue-on-error) car deploy.yml
#                     se déclenche sur le succès de CE workflow. Visibilité :
#                     annotation ::warning + step summary ; suivi hebdo
#                     approfondi : vercel-pins-watch.yml.
#
# Les trois jobs tournent en parallèle ; seul tools-audit est warning-only —
# quality et lighthouse rendent le workflow rouge si l'un des deux échoue.
#
# Ce workflow est aussi LA PORTE VERS LA PRODUCTION : deploy.yml se déclenche
# via workflow_run uniquement quand ce workflow se termine en `success` sur
# main, et déploie exactement le commit validé ici (head_sha). Un push dont le
# job quality échoue n'atteint jamais le déploiement.

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint + tests + audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # UNE commande : exactement celle du hook pre-commit. Elle commence par le
      # gate de version Node (donc la parité .nvmrc/engines/runtime est prouvée
      # ici aussi) et enchaîne ESLint 0 warning, tsc strict, props/casts, gardes
      # du harnais, stylelint, sélecteurs CSS, emoji, i18n, dates Windows, budget
      # de lignes et snapshot SQL.
      #
      # Recopier un sous-ensemble est précisément comment les deux chaînes ont
      # divergé : ce job lançait `npx eslint .` + `npx tsc` + deux gardes et
      # sautait silencieusement les six autres — dont stylelint et le harnais de
      # tests, c'est-à-dire la moitié des filets. Un gate qui n'est pas exécuté
      # ici ne protège rien ici.
      - name: Lint — la chaîne du poste telle quelle (npm run lint)
        run: npm run lint

      - name: Tests
        run: npm test

      # npm audit only needs the network when the lockfile actually changed:
      # scripts/check-audit.mjs caches its result (keyed on the lockfile sha,
      # valid 24 h) under AUDIT_CACHE=1. Persist that cache across runs so a
      # push that did not touch dependencies never re-queries the npm audit
      # endpoint — which also keeps the gate green during npm registry
      # incidents (the endpoint has timed out for hours while the registry
      # itself stayed up, cancelling every deploy at this step).
      - name: Restore audit gate cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/audit-gate.json
          key: audit-gate-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            audit-gate-

      - name: Audit gate (production clean + total within baseline 0)
        env:
          AUDIT_CACHE: '1'
        run: node scripts/check-audit.mjs

  lighthouse:
    runs-on: ubuntu-latest
    # Headroom calibrée sur les durées observées (56s à 917s selon le runner
    # partagé) : un job qui dépasse son timeout est ANNULÉ et annule tout le
    # workflow — ce qui bloque la porte deploy.yml. 25 min laissent 3 audits
    # Lighthouse + build se terminer même sur un runner lent.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node lit `.nvmrc`, mais son succès ne prouve pas dans le log que le
      # majeur RÉELLEMENT exécuté est celui épinglé (ni qu'engines est d'accord).
      # Ce gate — le même que celui en tête de `npm run lint` — le vérifie et
      # l'affiche, job par job : c'est la preuve côté runner.
      - name: Node version parity (.nvmrc ↔ engines ↔ runtime)
        run: node scripts/check-node-version.mjs

      - name: Install dependencies
        run: npm ci

      # Sans .env le bundle est livré sans configuration Supabase et l'app
      # s'arrête volontairement au chargement (fail-visible) — le score
      # s'effondrerait. Ces valeurs factices passent la validation (aucun
      # placeholder) et ne servent qu'au rendu de la page auditée ; aucun
      # secret n'est nécessaire ni utilisé ici.
      - name: Provide public env vars for the build (dummy values, perf check only)
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=https://perf-check.supabase.co
          VITE_SUPABASE_ANON_KEY=perf-check-anon-key
          VITE_APP_ENV=production
          APP_URL=http://localhost:4173/
          EOF

      - name: Lighthouse gate (build + preview + audit, fails below 0.60)
        env:
          # 0.60 et non 0.7 : les runners CI mesurent ~25 points sous la prod
          # réelle (build identique) — 0.60 bloque toujours les vraies régressions.
          PERF_THRESHOLD: '0.60'
          # Médiane de 3 audits : le score d'un seul run varie fortement selon
          # le runner partagé tiré au sort (39 à 67 observés sur le même build).
          LH_RUNS: '3'
        run: npm run check:perf

  # Gate contraste : construit l'app (clés publiques client Supabase — anon,
  # non secrètes), démarre vite preview et pilote un Chrome headless sur les
  # 6 thèmes × 8 overlays (dashboard, modales Ajout Élève / Saisie de Paiement,
  # notifications, fiche élève, relance parent, productivité, chat IA) + les
  # boutons d'action de la page Paie (Centre Technique / Employé / Administration,
  # en dessous de la ligne de flottaison — scannés en les faisant défiler à
  # l'écran pour qu'une régression de contraste y soit attrapée dès le push).
  # Toute paire texte/fond mesurée < 3:1 échoue le job — la même mesure qui a
  # chassé les textes blancs sur blancs, désormais automatisée et CI-gated.
  # AUCUN secret : l'audit tourne sur un backend de fixtures servi dans le
  # navigateur (scripts/lib/audit-fixtures.mjs) — la session de test est mintée
  # par l'interception du grant mot de passe, sans compte à créer ni à
  # supprimer, et sans écrire une ligne en base. Le gate mesure donc sur un push
  # comme sur une PR Dependabot ou une PR de fork, avec exactement les mêmes
  # données à chaque run.
  theme-contrast:
    name: Contraste thèmes (WCAG >= 3:1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node lit `.nvmrc`, mais son succès ne prouve pas dans le log que le
      # majeur RÉELLEMENT exécuté est celui épinglé (ni qu'engines est d'accord).
      # Ce gate — le même que celui en tête de `npm run lint` — le vérifie et
      # l'affiche, job par job : c'est la preuve côté runner.
      - name: Node version parity (.nvmrc ↔ engines ↔ runtime)
        run: node scripts/check-node-version.mjs

      - name: Install dependencies
        run: npm ci

      # Aucun env de build ici : en mode fixtures, l'audit injecte lui-même une
      # URL factice et une clé bidon dans le build (process.env, prioritaire sur
      # tout fichier .env) — il n'y a donc rien à préparer ni à cacher, et aucun
      # bundle audité ne peut viser la vraie base.

      - name: Theme contrast audit (6 thèmes x 8 overlays, échoue < 3:1)
        env:
          AUDIT_URL: http://127.0.0.1:4173/
          CHROME_PATH: /usr/bin/google-chrome
        # Par son nom, jamais recopiée : `check:contrast` EST cette commande,
        # et une copie diverge en silence — c'est exactement ce que refuse
        # scripts/check-ci-commands.mjs (ce garde a trouvé cette ligne).
        run: npm run check:contrast

  # Warning-only: the isolated deploy CLI (tools/) keeps its dev-only pins on
  # purpose — they must stay visible without ever blocking deploys, because
  # deploy.yml is triggered by THIS workflow's success.
  tools-audit:
    name: Tools audit (warning-only)
    runs-on: ubuntu-latest
    # Headroom above the script's own 2×90s bounded audit: even when the npm
    # audit endpoint stalls, the job must COMPLETE (exit 0 warning), never hit
    # its timeout — a timed-out job cancels the whole workflow run regardless
    # of continue-on-error, and deploy.yml gates on that run succeeding.
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Idem : le gate de parité tourne ici aussi pour que le job warning-only
      # ne soit pas le seul à pouvoir mentir sur sa version de Node.
      - name: Node version parity (.nvmrc ↔ engines ↔ runtime)
        run: node scripts/check-node-version.mjs

      - name: Audit tools/ from its lockfile (report only — never fails)
        run: node scripts/report-tools-audit.mjs
