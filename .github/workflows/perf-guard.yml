name: Quality & performance guard

# Porte de qualité unique à chaque push sur main — remplace les deux anciens
# workflows security-audit.yml (audit npm) et perf-guard.yml (Lighthouse) :
#
#   Job `quality`   : gate ESLint SANS WARNING (eslint --max-warnings 0 — le
#                     moindre warning, même bénin, échoue le push), puis tsc
#                     strict + câblage des props + gate des casts interdits,
#                     tests (node:test), puis le gate d'audit
#                     (scripts/check-audit.mjs) en deux volets :
#                       1. Aucune vulnérabilité de PRODUCTION (les dépendances
#                          runtime doivent être propres — tout ce qui est
#                          vulnérable est bloqué).
#                       2. Le nombre TOTAL de vulnérabilités reste à 0
#                          (baseline documentée — voir DEVELOPMENT_HISTORY.md ;
#                          le CLI vercel est isolé dans tools/, hors du gate).
#                     Toute nouvelle vulnérabilité (runtime ou dev) échoue.
#   Job `lighthouse`: mesure Lighthouse (mobile, performance) sur un build de
#                     production à chaque push. Échoue — et signale le push en
#                     rouge — si le score passe sous 0.60 en CI — seuil calibré
#                     sur les runners GitHub, plus lents que la machine locale :
#                     un build sain y mesure ~67 contre ~93 en prod réel.
#
# Les deux jobs tournent en parallèle ; le workflow est rouge si l'un échoue.
#
# Ce workflow est aussi LA PORTE VERS LA PRODUCTION : deploy.yml se déclenche
# via workflow_run uniquement quand ce workflow se termine en `success` sur
# main, et déploie exactement le commit validé ici (head_sha). Un push dont le
# job quality échoue n'atteint jamais le déploiement.

on:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint + tests + audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint — zero-warning gate (any warning fails the push)
        run: npx eslint . --max-warnings 0

      - name: Typecheck strict + props wiring + forbidden casts
        run: npx tsc --noEmit && node scripts/check-component-props.mjs && node scripts/check-forbidden-any.mjs

      - name: Tests
        run: npm test

      - name: Audit gate (production clean + total within baseline 0)
        run: node scripts/check-audit.mjs

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sans .env le bundle est livré sans configuration Supabase et l'app
      # s'arrête volontairement au chargement (fail-visible) — le score
      # s'effondrerait. Ces valeurs factices passent la validation (aucun
      # placeholder) et ne servent qu'au rendu de la page auditée ; aucun
      # secret n'est nécessaire ni utilisé ici.
      - name: Provide public env vars for the build (dummy values, perf check only)
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=https://perf-check.supabase.co
          VITE_SUPABASE_ANON_KEY=perf-check-anon-key
          VITE_APP_ENV=production
          APP_URL=http://localhost:4173/
          EOF

      - name: Lighthouse gate (build + preview + audit, fails below 0.60)
        env:
          # 0.60 et non 0.7 : les runners CI mesurent ~25 points sous la prod
          # réelle (build identique) — 0.60 bloque toujours les vraies régressions.
          PERF_THRESHOLD: '0.60'
          # Médiane de 3 audits : le score d'un seul run varie fortement selon
          # le runner partagé tiré au sort (39 à 67 observés sur le même build).
          LH_RUNS: '3'
        run: npm run check:perf
