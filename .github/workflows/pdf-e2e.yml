name: PDF E2E — pixel check sur la pile de recette

# Vérifie les reçus PDF AU PIXEL PRÈS contre les modèles papier de l'école : les
# trois documents de paie (mode auto), le reçu des parents (mode recu-parent), le
# reçu des mois cochés au guichet (mode recu-mois) et le reçu MUET complété depuis
# la fiche d'un élève (mode recu-muet), sur le build de CE commit, servi
# localement sur SA PROPRE pile Supabase.
#
# Trigger : le workflow « Deploy (Vercel) » (deploy.yml) se TERMINE sur main —
# le pixel-check tourne donc toujours contre le déploiement FRAÎCHEMENT publié,
# jamais contre un build intermédiaire. Le job `gate` vérifie que le run deploy
# s'est conclu en `success` (un deploy annulé ou en échec → skip neutre, pas de
# rouge parasite) puis le job `e2e` exécute scripts/verify-pdf-download.mjs en
# mode auto, PUIS en mode recu-parent, PUIS en mode recu-mois, PUIS en mode
# recu-muet :
#
#   auto (Paie/Salaires) :
#   1. compte auth éphémère créé via le service role et promu admin ;
#   2. Chrome headless → connexion réelle → Paie/Salaires ;
#   3. clic réel sur « Télécharger Reçu PDF » d'un membre (employé / admin /
#      technique — le membre technique ou admin de démo est créé via le vrai
#      bouton + formulaire quand aucun n'existe) ;
#   4. capture du PDF produit (CDP) et pixel-check à 34 px/mm contre le modèle :
#      taille de page identique, montants de la ligne 1 posés sur la ligne
#      imprimée, date centrée, cachet centré, overlay présent ;
#   5. nettoyage (compte + membre de démo + fichiers temporaires) — toujours,
#      même en échec. Exit 0 = toutes les vérifications passent.
#
#   recu-parent (Élèves) :
#   1. nouveau compte éphémère + connexion réelle → Élèves ;
#   2. clic réel sur « Télécharger Reçu PDF » du paiement d'un élève (le
#      paiement réel existant est utilisé ; sinon élève + paiement de démo
#      créés via l'API, supprimés au nettoyage) ;
#   3. pixel-check à 34 px/mm contre recu-parent.pdf : taille de page
#      identique, les 8 zones remplies (nom, somme en lettres, montant en
#      chiffres dans la pilule BPF, mois, classe, motif, date, numéro dans la
#      boîte N°) et le centrage des chiffres dans la pilule / du numéro dans
#      la boîte N° ;
#   4. nettoyage complet (compte + éventuel élève de démo + fichiers).
#
#   recu-mois (le GESTE du guichet, sur la même page Élèves) :
#   1. nouveau compte éphémère + connexion réelle, puis le VRAI formulaire de
#      saisie ouvert par son bouton de barre latérale ;
#   2. un élève de démo est créé pour ce geste (sans année scolaire, donc visible
#      quelle que soit l'année active), supprimé au nettoyage avec son paiement ;
#   3. l'élève est choisi dans sa liste, la date et le montant frappés, puis des
#      mois TROUÉS sont cochés : septembre, novembre, décembre — le mois proposé
#      d'avance (celui de la date, octobre) est DÉCOCHÉ, et les pastilles sont
#      cliquées une par rendu, sinon React regrouperait les mises à jour ;
#   4. l'envoi écrit le paiement, et le reçu du moment est capturé (CDP), puis le
#      dossier de téléchargement est VIDÉ et le reçu RÉIMPRIMÉ depuis la fiche de
#      l'élève, sur la ligne relue en base — un reçu réimprimé ne peut pas porter
#      des mois qui n'auraient jamais été écrits ;
#   5. les trois faits sont lus SUR LE PAPIER (texte extrait du PDF, jamais
#      deviné) : les trois mois sont NOMMÉS, le compte « 3 mois » est écrit (liste
#      trouée, pas plage), et OCTOBRE — le mois de la date — est ABSENT, faute de
#      quoi la ligne viendrait de la date et non du geste. Puis le pixel-check à
#      34 px/mm contre recu-parent.pdf, comme pour le reçu des parents ;
#   6. nettoyage complet (compte + élève de démo + son paiement + fichiers).
#
#   recu-muet (le RATTRAPAGE d'un reçu muet, par la fiche de l'élève) :
#   1. nouveau compte éphémère + connexion réelle → Élèves ;
#   2. un élève de démo et UN reçu MUET sont créés via l'API : le paiement est
#      inséré SANS la colonne `months`, et daté d'AVANT la migration qui l'a créée
#      — il ne déclare donc rien, sa réimpression ne nommerait que le mois de sa
#      date, et la fiche le compte parmi les paiements « sans mois déclaré » ;
#   3. la fiche est ouverte et lue AVANT : aucun mois réglé, la note des reçus
#      muets présente, le geste OFFERT (« Renseigner les mois ») — sans cet état
#      initial, un reçu déjà complet traverserait le mode en simple affichage ;
#   4. l'éditeur est jugé AVANT d'écrire : les douze mois de l'année offerts,
#      aucun pré-coché, l'enregistrement FERMÉ (écrire zéro mois ne déclarerait
#      rien de plus que le silence d'avant) ; les mois sont cochés par leur CLÉ
#      (`data-month`), jamais par leur libellé, puis enregistrés ;
#   5. la page est RECHARGÉE, la fiche rouverte, et c'est CETTE fiche-là qui est
#      jugée : elle marque RÉGLÉS exactement les trois mois, laisse À RÉGLER le
#      mois de la DATE (des mois qui viendraient d'elle se liraient là), ne
#      compte plus ce reçu comme muet et n'offre plus de le compléter. Le solde de
#      l'élève est relu en base : des mois ne sont pas de l'argent ;
#   6. le reçu est enfin RÉIMPRIMÉ depuis la fiche — il NOMME les trois mois,
#      écrit leur compte, et le mois de sa date reste ABSENT — puis pixel-checké à
#      34 px/mm contre recu-parent.pdf, comme le reçu des parents ;
#   7. nettoyage complet (compte + élève de démo + son reçu + fichiers).
#
# ─── CE QUI A CHANGÉ LE 2026-10-12, ET POURQUOI ──────────────────────────
# Le pixel-check pilotait l'application DÉPLOYÉE, et il créait pour cela un
# compte éphémère dans la base de l'ÉCOLE — plus une ligne de démo quand la base
# ne portait aucun paiement. Un contrôle n'a rien à écrire chez le client : le
# job monte donc SA PROPRE pile Supabase (`supabase start`, base vierge, les 34
# migrations du dépôt), construit l'application pointée dessus, la sert en local
# et y exécute TOUT ce qui a besoin d'un compte — pixel-check de paie, reçu des
# parents, mois cochés au guichet, reçu muet complété depuis la fiche, et
# navigation CSP.
#
# Ce que ce job continue de prouver, en LECTURE SEULE contre la production : la
# fraîcheur du déploiement (la prod sert le build de CE commit — c'est un fait de
# PUBLICATION, il ne demande aucun compte) et les en-têtes servis par l'hôte,
# dont la politique CSP comparée MOT POUR MOT à vercel.json.
#
# Ce qu'il ne prouve plus, et qui est dit plutôt que tu : le rendu n'est plus jugé
# sur le bundle servi par le CDN, mais sur le build de ce commit servi localement
# (mêmes sources, même commande de build, même Chrome). Les preuves d'hébergement
# — origine publique joignable, coquille et modules réellement servis — vivent
# dans `deploy.yml` et les veilles (`public-origin-watch`), qui visent le vrai
# domaine.
#
# Le checkout fournit le script ET les modèles papier commités ; les fetchs
# /templates/*.pdf sont servis par le script lui-même via CDP Fetch, ce qui rend la
# vérification hermétique au réseau (le build local n'a pas à servir ces fichiers).
#
# Secrets requis : AUCUN. Les clés de la pile de recette sont éphémères et rendues
# par la CLI (`supabase status -o env`) ; elles vivent dans le runner, le temps du
# job, et ne sont jamais imprimées.
#
# Trois gardes, dont deux qui n'écrivent plus chez l'école :
#   1. l'hôte, en LECTURE SEULE — X-Frame-Options (SAMEORIGIN/DENY) et
#      X-Content-Type-Options (nosniff) servis sur la racine, et la politique CSP
#      servie comparée mot pour mot à celle du dépôt
#      (`verify-csp-guard.mjs --policy-only`, sans compte ni navigateur) ;
#   2. la garde CSP NAVIGUE l'application servie localement, sous la politique du
#      dépôt étendue à l'origine de la pile — le SEUL écart admis, jugé par
#      `localStackGap` : une dérive non dérivée rougit. Sept pages principales,
#      violations refusées, canari du collecteur à chaque run (un zéro ne vaut que
#      si la mesure peut dire autre chose que zéro) ;
#   3. la garde finale anti-résidus, qui exige qu'aucun compte éphémère
#      (verify-*/e2e-*/audit-*/@audit.local) ne subsiste dans la PILE DE RECETTE
#      après tous les checks. Une régression du rendu, des en-têtes, de la
#      politique ou du nettoyage devient rouge ici.
#
# Le run échoue (rouge) si une seule vérification (pixel ou header) échoue : une
# régression de rendu des PDF (placement, cachet, taille) ou des headers de
# sécurité bloque la visibilité du problème ici, sans bloquer le déploiement
# lui-même (workflow_run en lecture seule — cf. la porte deploy.yml qui reste
# l'unique entrée en prod).
#
# ─── Les trois rouges HISTORIQUES (#170, #171, #172) et leur sort ────────────
#
# Trois runs se sont terminés en échec le 2026-09-13 au soir, sur trois commits
# (`9bbf535`, `5d0d5e2`, `1292ac5`), tous au même endroit : l'étape « reçu parent
# (mode recu-parent) », avec `⚠️ ligne « Rahim » non ouverte (essai 1/2/3)` puis
# `❌ bouton « Reçu » de « Rahim » introuvable dans la fiche`. La reprise sondée
# a fait son travail — elle a retenté trois fois, puis a NOMMÉ ce qu'elle ne
# trouvait pas, au lieu de bloquer en silence. La cause était en amont : l'élève
# Rahim (vraie ligne de la base partagée) était rangé sous une année que la
# session n'affichait pas, donc la liste ne montrait aucune ligne à ouvrir.
# C'est l'**année scolaire déduite du calendrier** qui a fermé ce chemin.
#
# Ces trois runs ne peuvent plus redevenir verts, et c'est DÉLIBÉRÉ : ils
# vérifient que la prod sert LE build de leur commit, et la prod sert maintenant
# le build de `main`. Un « Re-run » échouerait donc à l'étape de fraîcheur — un
# rouge qui accuserait la PUBLICATION au lieu du rendu, c'est-à-dire exactement
# ce que cette étape existe pour éviter. Ils restent dans l'historique comme la
# trace de la panne, et le vert qui les suit est le seul verdict qui compte.
#
# Verts depuis, sur le même chemin (reçu parent) : #173 (`2e2dd6e`), #174, et
# #175 relancé À LA MAIN (`workflow_dispatch`) pour ne pas confondre une preuve
# fraîche avec un historique : la page servie déclare le build de ce commit
# (1 essai), la paie rend 9/9, le reçu parent 12/12 — la ligne de Rahim s'ouvre
# du PREMIER coup — et l'étape « Publier la preuve d'action », sautée pendant
# tout l'échec, s'exécute.

on:
  workflow_run:
    workflows: ["Deploy (Vercel)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Groupe PROPRE depuis que le pixel-check a sa propre pile. Il était partagé
  # avec `business-e2e.yml` parce que les deux écrivaient dans la MÊME base
  # (comptes éphémères, lignes de démo) et se jugeaient mutuellement leurs
  # résidus — mesuré le 2026-09-13 : 18/19, tout vert sauf le compte éphémère EN
  # COURS du voisin, appelé un résidu. Ce motif a disparu avec l'écriture
  # partagée : aucun des deux n'écrit plus dans la base de l'école.
  group: pdf-e2e-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # lire la conclusion du run deploy

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.deploy-gate.outputs.proceed }}
    steps:
      - name: Gate — pixel-check seulement si le deploy a réussi
        id: deploy-gate
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('proceed', 'false');
            if (context.eventName !== 'workflow_run') {
              console.log('Manual dispatch — vérification manuelle contre la prod.');
              core.setOutput('proceed', 'true');
              return;
            }
            const run = context.payload.workflow_run;
            console.log(`Deploy workflow concluded '${run.conclusion}' on ${run.head_sha}.`);
            if (run.conclusion !== 'success') {
              console.log(`Deploy non réussi (${run.conclusion}) — rien à pixel-checker, skip neutre.`);
              return;
            }
            core.setOutput('proceed', 'true');

  e2e:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Headroom : `supabase start` tire une quinzaine de conteneurs (2–5 min), le
    # build de l'application, puis trois documents rasterisés à 34 px/mm dans un
    # Chrome piloté et deux passes de navigation CSP. 35 min laissent un runner
    # partagé lent aller au bout.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Pinné sur la version éprouvée par `supabase-migrations.yml` et
      # `business-e2e.yml` : mêmes migrations, même pile, mêmes verdicts.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Install dependencies
        run: npm ci

      - name: Élever la pile de recette (les 35 migrations, base vierge)
        run: supabase start

      # Les clés de la pile locale sont ÉPHÉMÈRES et la CLI les rend : elles vivent
      # dans le runner, le temps du job, et ne sont demandées à personne. Le
      # fichier est SOURCÉ (même idiome que `supabase-migrations.yml`) : la CLI
      # écrit `API_URL="http://…"` AVEC des guillemets, et c'est le shell qui les
      # retire — recopier la ligne donnerait une adresse entre guillemets, c'est-à-dire
      # une URL fausse que rien ne signalerait. Le pont de noms est fait ici, une
      # fois : la CLI nomme API_URL/ANON_KEY/SERVICE_ROLE_KEY, les scripts du dépôt
      # lisent les noms canoniques VITE_SUPABASE_* / SUPABASE_*.
      - name: Exporter les clés de la pile (éphémères, jamais imprimées)
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/recette.env
          set -a
          . /tmp/recette.env
          set +a
          for pair in "API_URL=$API_URL" "ANON_KEY=$ANON_KEY" "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"; do
            name=${pair%%=*}
            if [ -z "${pair#*=}" ]; then
              echo "❌ $name vide dans la pile locale — sans clé, ce job ne mesure rien." >&2
              exit 1
            fi
          done
          {
            echo "SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          echo "clés de la pile exportées (${#API_URL} / ${#ANON_KEY} / ${#SERVICE_ROLE_KEY} caractères)"

      # Le garde reste en travers du chemin, ici comme sur un poste : il compte
      # les sept tables métier et n'autorise l'écriture que si elles sont vides.
      # Ce job-ci crée des comptes et parfois un élève + un paiement de démo :
      # la garde passe donc AVANT la première écriture.
      - name: Recette — écrire seulement dans une base libre de données d’école
        run: npm run check:recette-base

      - name: Build de l’application pointé sur la pile de recette (mode staging)
        env:
          VITE_APP_ENV: staging
        run: npm run build:staging

      # `MAMA_LOCAL_SUPABASE_ORIGIN` fait servir, par l'aperçu local, la politique
      # du dépôt étendue à l'origine de la pile (vite.config.ts +
      # scripts/lib/csp-origins.mjs) : sans elle la garde CSP n'aurait aucune
      # politique à juger — et une page sans politique ne peut pas violer.
      - name: Servir ce build en local (127.0.0.1:4173), sous la politique du dépôt
        run: |
          MAMA_LOCAL_SUPABASE_ORIGIN="$SUPABASE_URL" \
            nohup npm run preview -- --port=4173 --strictPort --host=127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4173/ || true)
            if [ "$code" = "200" ]; then echo "build servi (HTTP 200, essai $i)"; exit 0; fi
            echo "attente du build… HTTP $code (essai $i/30)"
            sleep 2
          done
          echo "❌ le build n’a pas répondu en 60 s :" >&2
          cat /tmp/preview.log >&2
          exit 1

      # Attendre un HTTP 200 ne suffit PAS : le déploiement PRÉCÉDENT en rend un,
      # et pendant la propagation de l'alias un cache de bord sert encore l'ancien
      # HTML. On jugeait alors le build d'un AUTRE commit et on rendait un rouge qui
      # accusait l'application pour une page jamais publiée. Cette étape reste donc
      # — elle est la preuve de PUBLICATION, et elle n'a besoin d'aucun compte : on
      # attend que la page SERVIE déclare le build de CE commit (l'identité écrite
      # dans son HTML par `scripts/lib/build-stamp.mjs`) ; son refus nomme la
      # PUBLICATION, jamais le rendu.
      - name: Wait until prod serves THIS commit's build
        # Mandat de preuve : cette étape publie SA mesure (quelle identité la prod
        # sert, et en combien d'essais) — c'est la phrase qui rend le rapport E2E
        # honnête sur ce qu'il a jugé.
        env:
          AUTOMATION_EVIDENCE: '1'
        run: >-
          node scripts/wait-for-deployment.mjs
          --url=https://mama-thera-finance.vercel.app/
          --sha=${{ github.event.workflow_run.head_sha || github.sha }}
          --timeout=240

      # Depuis que le pixel-check juge une pile locale — donc une politique
      # DÉRIVÉE —, c'est CE pas qui garde la preuve côté hébergeur : la politique
      # que la production sert, comparée mot pour mot à vercel.json. Lecture seule,
      # sans compte ni navigateur : il peut viser la prod sans y écrire une ligne.
      - name: Politique CSP servie par la production — comparée au dépôt
        env:
          AUTOMATION_EVIDENCE: '1'
        run: node scripts/verify-csp-guard.mjs --url=https://mama-thera-finance.vercel.app/ --policy-only

      # Garde de sécurité : X-Frame-Options (SAMEORIGIN/DENY) et
      # X-Content-Type-Options (nosniff) doivent être servis sur la racine —
      # la config vercel.json les applique à toutes les routes (source /(.*)).
      # Un oubli ou une valeur affaiblie échoue le run (rouge) sans bloquer le
      # déploiement lui-même.
      - name: Security headers — X-Frame-Options & X-Content-Type-Options
        run: |
          set -euo pipefail
          url=https://mama-thera-finance.vercel.app/
          headers=$(curl -s -D - -o /dev/null --max-time 15 "$url" || true)
          ok=1
          grep -qi '^x-frame-options:' <<<"$headers" || { echo "❌ X-Frame-Options manquant"; ok=0; }
          grep -qi '^x-content-type-options:' <<<"$headers" || { echo "❌ X-Content-Type-Options manquant"; ok=0; }
          xfo=$(grep -i '^x-frame-options:' <<<"$headers" | head -1 | tr -d '\r')
          case "$xfo" in
            *DENY*|*SAMEORIGIN*) : ;;
            *) echo "❌ X-Frame-Options avec valeur inattendue : $xfo"; ok=0 ;;
          esac
          if [ "$ok" = "1" ]; then
            echo "✅ X-Frame-Options + X-Content-Type-Options servis ($url)"
          else
            echo "--- headers reçus ---"
            echo "$headers"
            exit 1
          fi

      # Garde CSP : le header doit être présent ET respecté. Le script crée un
      # compte éphémère admin DANS LA PILE DE RECETTE, se connecte par l'UI réelle
      # sur le build de ce commit, visite les 7 pages principales (tableau de bord,
      # paie, dépenses, élèves, parents, calendrier, archives) et échoue si une
      # violation Content-Security-Policy est émise (console +
      # SecurityPolicyViolationEvent). `--expect-local-origin` fait juger l'écart :
      # la politique servie DOIT être celle du dépôt plus cette origine, rien
      # d'autre. Le compte est supprimé en fin de run, même en échec.
      - name: CSP guard — aucune violation en navigation (pile de recette)
        # Mandat de preuve : cette garde publie SES mesures (pages principales
        # parcourues en session réelle, violations détectées) au lieu d'une
        # phrase de workflow. Sans mandat posé par l'étape, elle se tait.
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUTOMATION_EVIDENCE: '1'
        run: >-
          node scripts/verify-csp-guard.mjs
          --url=http://127.0.0.1:4173/
          --expect-local-origin="$SUPABASE_URL"

      - name: PDF pixel-check E2E — paie (mode auto, sur la pile de recette)
        # Mandat de preuve : chaque invocation publie SA mesure (le nombre de
        # vérifications passées sur le document produit) — deux runs du même
        # script publient donc deux preuves, et l'audit les additionne.
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUTOMATION_EVIDENCE: '1'
        run: node scripts/verify-pdf-download.mjs --mode auto --url=http://127.0.0.1:4173/

      # Deuxième flux, page Élèves : le reçu des parents (formulaire papier
      # recu-parent.pdf rempli en overlay). Chaque invocation crée son propre
      # compte éphémère — indépendants, nettoyés chacun à la fin, dans la pile.
      - name: PDF pixel-check E2E — reçu parent (mode recu-parent, sur la pile de recette)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUTOMATION_EVIDENCE: '1'
        run: node scripts/verify-pdf-download.mjs --mode recu-parent --url=http://127.0.0.1:4173/

      # Troisième flux, toujours page Élèves : le GESTE du guichet quand il coche
      # des MOIS (mode recu-mois). Le caissier ouvre la saisie, choisit l'élève,
      # frappe date et montant, coche les mois, envoie — puis le reçu est relu EN
      # BASE et RÉIMPRIMÉ par la fiche de l'élève : c'est la réimpression qui prouve
      # que les mois ont été écrits, un reçu du moment pouvant très bien les porter
      # sans qu'ils aient jamais quitté l'écran. Le dossier de téléchargement est
      # vidé avant la réimpression, donc le second PDF mesuré est bien le second.
      # Trois mois TROUÉS (septembre, novembre, décembre) : le reçu doit les NOMMER
      # un par un — une plage continue se dirait « Septembre à Novembre » — et le
      # mois de la date (octobre) doit rester ABSENT du papier, faute de quoi la
      # ligne viendrait de la date et non du geste.
      - name: PDF pixel-check E2E — mois cochés (mode recu-mois, sur la pile de recette)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUTOMATION_EVIDENCE: '1'
        run: node scripts/verify-pdf-download.mjs --mode recu-mois --url=http://127.0.0.1:4173/

      # Quatrième flux, page Élèves encore : le RATTRAPAGE d'un reçu MUET (mode
      # recu-muet). Un paiement ANTÉRIEUR à la colonne `payments.months` ne
      # déclare aucun mois — sa réimpression ne nommerait que le mois de sa date,
      # et la fiche le compte parmi les « sans mois déclaré ». L'école le complète
      # depuis la fiche (bouton « Renseigner les mois », pastilles cochées par
      # leur clé, enregistrement), puis la page est RECHARGÉE : la fiche doit
      # marquer ces mois RÉGLÉS, laisser le mois de la DATE à régler, ne plus
      # compter ce reçu comme muet et ne plus offrir de le compléter — et le solde
      # de l'élève ne doit pas avoir bougé, des mois n'étant pas de l'argent. Le
      # reçu est enfin réimprimé : les mois y sont NOMMÉS, et le mois de la date en
      # reste absent. C'est le seul mode qui juge l'APRÈS-RECHARGEMENT : sans lui,
      # une fiche pourrait porter les mois sans qu'ils aient jamais quitté l'écran.
      - name: PDF pixel-check E2E — reçu muet complété (mode recu-muet, sur la pile de recette)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUTOMATION_EVIDENCE: '1'
        run: node scripts/verify-pdf-download.mjs --mode recu-muet --url=http://127.0.0.1:4173/

      # Garde finale anti-résidus : chaque script E2E (garde CSP, pixel-checks
      # paie/reçu parent/mois cochés/reçu muet) crée et supprime son compte éphémère dans un finally —
      # mais un nettoyage cassé (crash, erreur avalée) laisserait un résidu
      # (verify-*/e2e-*/audit-*/@audit.local). Cette étape tourne en DERNIER et
      # fait échouer le run si un compte éphémère subsiste dans auth.users ou
      # dans public.user_profiles de la PILE DE RECETTE (la FK en ON DELETE
      # CASCADE doit avoir supprimé le profil avec le compte). Elle lit la même
      # base que les pixel-checks, par l'environnement (le job n'écrit aucun
      # `.env`) ; lecture seule, ne supprime rien.
      - name: Vérification finale — aucun compte éphémère résiduel en base
        # `if: always()` : un pixel-check en échec ne doit pas EMPÊCHER la
        # vérification des résidus — c'est justement quand la chaîne casse au
        # milieu qu'un compte éphémère reste en base. Mesuré le 2026-09-12 : un
        # 504 sur la suppression du compte éphémère, garde sautée (l'étape
        # précédente avait échoué), résidu découvert seulement au run suivant.
        if: always()
        # Mandat de preuve : c'est la seule étape de cette chaîne qui MESURE l'état
        # final du monde (comptes et profils réellement parcourus en base) — elle
        # publie donc ce qu'elle a compté, au lieu d'une phrase de workflow.
        env:
          AUTOMATION_EVIDENCE: '1'
        run: node scripts/verify-ephemeral-cleanup.mjs

      # Preuve publiée par l'étape NOMMÉE (lue dans les étapes du run par
      # `npm run check:automations`), et publiée en DERNIER : elle affirme que la
      # chaîne est allée au bout — fraîcheur du déploiement, en-têtes et politique
      # de l'hôte (lecture seule), puis garde CSP et les pixel-checks sur la pile
      # de recette, et le nettoyage de ses comptes éphémères.
      #
      # La SUBSTANCE, elle, ne vient plus d'ici : chaque script de la chaîne
      # publie désormais SA mesure sous mandat — la fraîcheur son identité servie,
      # la politique comparée ses directives, la garde CSP ses pages parcourues et
      # ses violations, chaque pixel-check ses vérifications sur le document
      # produit, le nettoyage final ses enregistrements parcourus. Cette étape
      # reste pour ce qu'AUCUN script ne peut mesurer : le fait que la chaîne
      # entière soit allée au bout (l'étape d'en-têtes, écrite en YAML sans script
      # à elle, et l'ORDRE des gardes).
      - name: Publier la preuve d’action — chaîne PDF E2E
        run: >-
          node scripts/publish-automation-evidence.mjs --acted
          --reason "chaîne PDF E2E allée au bout : fraîcheur du déploiement et politique CSP servie par l'hôte relues en lecture seule, puis garde CSP et pixel-checks paie/reçu parent/mois cochés/reçu muet complété depuis la fiche sur la pile de recette de CE job (les 35 migrations, base vierge), comptes éphémères tous supprimés — la mesure en base est publiée par scripts/verify-ephemeral-cleanup.mjs"